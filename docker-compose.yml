services:
  mysql:
    image: mysql:8.0
    container_name: prccd-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: prccd
    ports:
      - "3306:3306"
    volumes:
    - prccd_mysql_data:/var/lib/mysql
    - ./backend/shared/schema_completo.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro,Z
    - ./backend/shared/seed_completo.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro,Z
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "127.0.0.1",
          "-uroot",
          "-proot"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 120s

  certificacion-auditoria:
    build:
      context: ./backend/certificacion-auditoria
      dockerfile: Dockerfile
    container_name: prccd-certificacion-auditoria
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: prccd
      PORT: 4003
      FRONTEND_URL: http://localhost:5173
      PRIVATE_KEY_PATH: /run/secrets/certificacion/private.pem
      PUBLIC_KEY_PATH: /run/secrets/certificacion/public.pem
    ports:
      - "4003:4003"
    volumes:
      - ./backend/certificacion-auditoria/keys:/run/secrets/certificacion:ro,Z
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:4003/api/salud').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  dev2-integracion:
    build:
      context: ./backend/dev2-integracion
      dockerfile: Dockerfile
    container_name: prccd-dev2-integracion
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: prccd
      PORT: 4002
      FRONTEND_URL: http://localhost:5173
      AES_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      AES_IV: 0123456789abcdef0123456789abcdef
    ports:
      - "4002:4002"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:4002/api/salud').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  dev1-evaluaciones:
    build:
      context: ./backend/dev1-evaluaciones
      dockerfile: Dockerfile
    container_name: prccd-dev1-evaluaciones
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: prccd
      PORT: 4001
      FRONTEND_URL: http://localhost:5173
    ports:
      - "4001:4001"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:4001/api/salud').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  sm-seguridad:
    build:
      context: ./backend/sm-seguridad
      dockerfile: Dockerfile
    container_name: prccd-sm-seguridad
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: prccd
      PORT: 4005
      FRONTEND_URL: http://localhost:5173
      AES_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      AES_IV: 0123456789abcdef0123456789abcdef
    ports:
      - "4005:4005"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:4005/api/salud').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  dev4-antifraude:
    build:
      context: ./backend/dev4-antifraude
      dockerfile: Dockerfile
    container_name: prccd-dev4-antifraude
    restart: unless-stopped
    environment:
      PORT: 4004
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: prccd
      FRONTEND_URL: http://localhost:5173
    ports:
      - "4004:4004"
    volumes:
      - ./backend/dev4-antifraude/uploads:/app/src/uploads
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:4004/api/salud').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  frontend:
    build:
      context: ./frontend/portal-prccd
      dockerfile: Dockerfile
    container_name: prccd-frontend
    restart: unless-stopped
    environment:
      VITE_EVALUACIONES_API_URL: http://localhost:4001
      VITE_INTEGRACION_API_URL: http://localhost:4002
      VITE_CERTIFICACION_API_URL: http://localhost:4003
      VITE_ANTIFRAUDE_API_URL: http://localhost:4004
      VITE_SEGURIDAD_API_URL: http://localhost:4005
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/portal-prccd:/app:Z
      - /app/node_modules
    depends_on:
      certificacion-auditoria:
        condition: service_healthy

volumes:
  prccd_mysql_data: